name: Collect and deploy Meme Radar

on:
  schedule:
    # Every 6 hours. GitHub explicitly does not guarantee exact start times.
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  # Do not let a delayed run overlap the next one. Queued runs are kept.
  group: meme-radar-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -s requirements.txt ]; then
            python -m pip install -r requirements.txt
          fi

      - name: Unit tests
        run: python -m unittest discover -s tests -t . -v

      - name: Collect public feed
        run: python -m collector.collect

      - name: Validate and stage feed
        run: python scripts/build_feed.py --check --stage --summary

      - name: Commit only substantive data changes
        id: commit
        run: |
          git config user.name "meme-radar-bot"
          git config user.email "meme-radar-bot@users.noreply.github.com"
          if git diff --quiet -- data/feed.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No substantive feed change; skip commit."
          else
            git add data/feed.json
            git commit -m "chore(data): refresh public feed"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Stage Pages payload
        run: python scripts/build_feed.py --stage

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: collect
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
