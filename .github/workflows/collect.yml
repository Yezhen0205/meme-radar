name: Collect images and text, deploy

on:
  schedule:
    # Every 6 hours. GitHub does not guarantee an exact start time.
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: meme-radar-all
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Unit tests
        run: python -m unittest discover -s tests -t . -v

      # Deliberately continue after a collector failure so one pipeline cannot
      # erase or block the other data file.  Each collector writes its own file.
      - name: Collect text feed
        id: text
        continue-on-error: true
        run: python -m collector.collect --output data/text.json

      - name: Collect image gallery
        id: gallery
        continue-on-error: true
        run: python -m gallery.collect

      - name: Warn when a collector process failed
        if: steps.text.outcome == 'failure' || steps.gallery.outcome == 'failure'
        run: |
          echo "::warning title=Meme Radar collector process::A collector process failed; its previous data file is retained and the other collector continues."

      - name: Validate and stage gallery
        run: python scripts/build_gallery.py --check --stage --summary

      - name: Validate and stage text
        run: python scripts/build_text.py --check --stage --summary

      - name: Warn when health needs attention
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          health = json.loads(Path("data/health.json").read_text(encoding="utf-8"))
          print("image health:", health.get("status"), "alerts:", health.get("alerts"))
          for alert in health.get("alerts", []):
              print(f"::warning title=Meme Radar image health::{alert}")
          text = json.loads(Path("data/text.json").read_text(encoding="utf-8"))
          run = text.get("run", {})
          print("text:", text.get("generated_at"), run)
          if run.get("sources_failed", 0) or run.get("sources_skipped", 0) or text.get("stale"):
              print(f"::warning title=Meme Radar text health::text sources failed={run.get('sources_failed', 0)} skipped={run.get('sources_skipped', 0)} stale={text.get('stale')}")
          PY

      - name: Commit only substantive data changes
        id: commit
        run: |
          git config user.name "meme-radar-bot"
          git config user.email "meme-radar-bot@users.noreply.github.com"
          if git diff --quiet -- data/gallery.json data/health.json data/text.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No substantive data change; skip commit."
          else
            git add data/gallery.json data/health.json data/text.json
            git commit -m "chore(data): refresh images, memes and hot topics"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Stage Pages payload
        run: |
          python scripts/build_gallery.py --stage
          python scripts/build_text.py --stage

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: collect
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
