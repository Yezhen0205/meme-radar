name: Collect gallery and deploy

on:
  schedule:
    # Every 6 hours. GitHub does not guarantee an exact start time.
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: meme-radar-gallery
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Unit tests
        run: python -m unittest discover -s tests -t . -v

      - name: Collect Reddit RSS, Tieba and trends
        run: python -m gallery.collect

      - name: Validate and stage gallery
        run: python scripts/build_gallery.py --check --stage --summary

      - name: Warn when health needs attention
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          health = json.loads(Path("data/health.json").read_text(encoding="utf-8"))
          print("health:", health.get("status"), "alerts:", health.get("alerts"))
          for alert in health.get("alerts", []):
              print(f"::warning title=Meme Radar health::{alert}")
          PY

      - name: Commit only substantive data changes
        id: commit
        run: |
          git config user.name "meme-radar-bot"
          git config user.email "meme-radar-bot@users.noreply.github.com"
          if git diff --quiet -- data/gallery.json data/health.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No substantive gallery change; skip commit."
          else
            git add data/gallery.json data/health.json
            git commit -m "chore(data): refresh image gallery"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Stage Pages payload
        run: python scripts/build_gallery.py --stage

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: collect
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
