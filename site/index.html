<!doctype html>
<html lang="zh-CN" data-theme="auto">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f4f1e8" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#11130f" media="(prefers-color-scheme: dark)">
  <meta name="description" content="热梗雷达：自动收集中文互联网的搞笑帖子、抽象热梗、神回复和评论区金句，手机浏览器直接阅读。">
  <title>热梗雷达 · Meme Radar</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="app.css">
  <script src="app.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#feed">跳到内容</a>

  <div class="app-shell">
    <header class="topbar">
      <div class="brand">
        <div class="radar-mark" aria-hidden="true">
          <svg viewBox="0 0 48 48" fill="none">
            <circle cx="24" cy="24" r="19" stroke="currentColor" stroke-opacity=".24" stroke-width="1.5"/>
            <circle cx="24" cy="24" r="12" stroke="currentColor" stroke-opacity=".38" stroke-width="1.5"/>
            <circle cx="24" cy="24" r="5" stroke="currentColor" stroke-width="1.5"/>
            <path class="radar-sweep" d="M24 24 39 13" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            <circle cx="34.5" cy="29" r="2.4" fill="currentColor"/>
          </svg>
        </div>
        <div class="brand-copy">
          <p class="eyebrow">MEME RADAR</p>
          <h1>热梗雷达</h1>
        </div>
      </div>
      <div class="top-actions">
        <button id="themeToggle" class="icon-btn" type="button" aria-label="切换主题（跟随系统）" title="切换主题">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M12 3v2M12 19v2M5.6 5.6 7 7M17 17l1.4 1.4M3 12h2M19 12h2M5.6 18.4 7 17M17 7l1.4-1.4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
            <circle cx="12" cy="12" r="4.2" stroke="currentColor" stroke-width="1.7"/>
          </svg>
        </button>
        <button id="favToggle" class="icon-btn" type="button" aria-pressed="false" aria-label="只看收藏">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M6.5 4.5h11a1 1 0 0 1 1 1v15l-6.5-4-6.5 4v-15a1 1 0 0 1 1-1Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
          </svg>
          <span id="favCount" class="count-badge" hidden>0</span>
        </button>
      </div>
    </header>

    <main>
      <section class="hero" aria-labelledby="heroTitle">
        <div class="hero-top">
          <span class="hero-kicker">LIVE · 中文互联网</span>
          <span id="dataStatus" class="status-pill is-loading">连接中</span>
        </div>
        <h2 id="heroTitle">今天互联网<br><em>又整了什么活？</em></h2>
        <p id="heroMeta" class="hero-meta">正在接收公开热榜与评论区信号…</p>
        <div class="hero-stats" aria-label="内容数量">
          <div class="hero-stat">
            <strong id="statMeme">—</strong>
            <span>热梗</span>
          </div>
          <div class="hero-stat">
            <strong id="statReply">—</strong>
            <span>神回复</span>
          </div>
          <div class="hero-stat">
            <strong id="statComment">—</strong>
            <span>评论金句</span>
          </div>
        </div>
      </section>

      <div id="notice" class="notice" role="status" hidden></div>

      <section class="control-panel" aria-label="筛选与搜索">
        <div class="search-wrap">
          <svg class="search-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <circle cx="10.8" cy="10.8" r="6.4" stroke="currentColor" stroke-width="1.8"/>
            <path d="m16 16 4.5 4.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          </svg>
          <input id="searchInput" type="search" placeholder="搜索标题、神回复、来源…" autocomplete="off" enterkeyhint="search" aria-label="搜索内容">
          <button id="clearSearch" class="clear-search" type="button" aria-label="清空搜索" hidden>×</button>
        </div>

        <nav class="tab-scroller" aria-label="内容分类">
          <div class="tabs" role="tablist">
            <button class="tab" type="button" role="tab" data-filter="meme" aria-selected="true">今日热梗 <span id="countMeme" class="tab-count"></span></button>
            <button class="tab" type="button" role="tab" data-filter="reply" aria-selected="false">神回复 <span id="countReply" class="tab-count"></span></button>
            <button class="tab" type="button" role="tab" data-filter="comment" aria-selected="false">评论金句 <span id="countComment" class="tab-count"></span></button>
            <button class="tab" type="button" role="tab" data-filter="hot" aria-selected="false">综合热点 <span id="countHot" class="tab-count"></span></button>
            <button class="tab" type="button" role="tab" data-filter="latest" aria-selected="false">最新更新</button>
          </div>
        </nav>

        <div class="list-meta">
          <p id="resultMeta" class="result-meta" aria-live="polite">正在整理信息流…</p>
          <div class="sort-group" role="group" aria-label="排序方式">
            <button id="sortLatest" class="sort-btn" type="button" data-sort="latest" aria-pressed="true">最新</button>
            <button id="sortRank" class="sort-btn" type="button" data-sort="rank" aria-pressed="false">榜位</button>
          </div>
        </div>
        <p id="rankHint" class="rank-hint" hidden>按各来源内榜位排序；不同来源的热度值不可直接比较。</p>
      </section>

      <section id="feed" class="feed" aria-label="内容流" aria-live="polite" aria-busy="true">
        <article class="card skeleton-card" aria-hidden="true">
          <div class="skeleton-line short"></div>
          <div class="skeleton-line title"></div>
          <div class="skeleton-line"></div>
          <div class="skeleton-line medium"></div>
        </article>
        <article class="card skeleton-card" aria-hidden="true">
          <div class="skeleton-line short"></div>
          <div class="skeleton-line title"></div>
          <div class="skeleton-line medium"></div>
        </article>
        <article class="card skeleton-card" aria-hidden="true">
          <div class="skeleton-line short"></div>
          <div class="skeleton-line title"></div>
          <div class="skeleton-line"></div>
        </article>
      </section>

      <section id="empty" class="empty" hidden aria-live="polite">
        <div class="empty-radar" aria-hidden="true">
          <span></span><span></span><span></span>
        </div>
        <h2 id="emptyTitle">这里还没有信号</h2>
        <p id="emptyText">自动采集可能尚未完成，稍后再来看看。</p>
        <button id="emptyAction" class="primary-btn" type="button" hidden>重新加载</button>
      </section>

      <div id="loadMoreWrap" class="load-more-wrap" hidden>
        <button id="loadMore" class="load-more" type="button">加载更多</button>
      </div>

      <section id="sourcePanel" class="source-panel" hidden aria-labelledby="sourceTitle">
        <details>
          <summary>
            <span id="sourceTitle">数据源状态</span>
            <span id="sourceSummary" class="source-summary"></span>
          </summary>
          <div id="sourceList" class="source-list"></div>
          <p class="source-note">热榜接口只提供榜单快照；B站评论为公开热评与回复，不是完整评论树。热度只在同一来源、同一类型内可比。</p>
        </details>
      </section>
    </main>

    <footer class="footer">
      <p><strong>热梗雷达</strong> · 把中文互联网的乐子，装进一部手机。</p>
      <p>只聚合公开内容，版权归原作者与平台所有。不登录、不追踪、不伪造热度。</p>
      <p class="footer-links"><a href="https://github.com/Yezhen0205/meme-radar" id="repoLink" target="_blank" rel="noopener noreferrer">查看项目源码与采集说明</a></p>
    </footer>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <noscript><p class="noscript">这个阅读器需要 JavaScript 才能加载信息流。</p></noscript>

  <template id="cardTemplate">
    <article class="card">
      <div class="card-top">
        <span class="cat-badge"></span>
        <button class="bookmark" type="button" aria-label="收藏" aria-pressed="false">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M6.5 4.5h11a1 1 0 0 1 1 1v15l-6.5-4-6.5 4v-15a1 1 0 0 1 1-1Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
          </svg>
        </button>
      </div>
      <div class="card-main">
        <div class="card-copy">
          <a class="card-link" target="_blank" rel="noopener noreferrer nofollow">
            <h3 class="card-title"></h3>
            <p class="card-summary"></p>
          </a>
          <p class="card-context" hidden></p>
        </div>
        <img class="card-thumb" alt="" loading="lazy" decoding="async" referrerpolicy="no-referrer" hidden>
      </div>
      <div class="card-related" hidden></div>
      <div class="card-meta">
        <span class="source-name"></span>
        <span class="meta-dot" aria-hidden="true"></span>
        <span class="item-time"></span>
        <span class="heat-pill" hidden></span>
      </div>
    </article>
  </template>
</body>
</html>
